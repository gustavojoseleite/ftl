# Parâmetros dos nós do FTL. O uso previsto é um arquivo por experimento:
# copie este, mude o que o experimento muda e passe-o com
#   ros2 launch ftl_bringup ftl.launch.py params_file:=<caminho>
#
# "/**/<nó>" casa com esse nó em qualquer namespace de veículo em que ele rode.

/**/road_follow:                # dirige o líder
  ros__parameters:
    route: lap                  # lap | origin_bend | follow  (ver road_follow.py)
    laps: 0                     # 0 = até ser parado
    speed: 3.0                  # m/s nas retas

/**/pose_estimator:             # todos os veículos
  ros__parameters:
    # O `datum` do referencial compartilhado. Todos os veículos devem usar o mesmo;
    # este é a origem de `spherical_coordinates` dos mundos da fazenda de citros.
    datum_lat: -20.9494
    datum_lon: -48.4794
    fix_samples: 25             # fixes na média, parado, para o ponto inicial
    fix_alpha: 0.05             # puxada para cada fix: constante de tempo de 4 s a 5 Hz

/**/follower:                   # cada seguidor
  ros__parameters:
    gap: 10.0                   # m ao longo do caminho, de base a base (= o espaçamento do comboio)
    min_gap: 5.0                # m: para abaixo disto, não importa o que o veículo da frente faça
    k_gap: 0.4                  # (m/s) por metro de erro do espaçamento
    v_max: 4.0                  # m/s; o plugin do trator chega no máximo a 4,2
    accel: 1.0                  # m/s^2 de rampa na velocidade comandada
    lookahead_min: 4.0          # m, `pure pursuit` parado
    lookahead_gain: 1.0         # s: + isto vezes a velocidade
    lookahead_max: 10.0         # m
    min_radius: 3.2             # m: o círculo de giro do trator com a direção toda esterçada
    uncertainty: 1.0            # m: incerteza da posição estimada (perfil `default`);
                                # a covariância do estado a substituirá
